# Practice Track Mixing Configuration
# =====================================
# This file controls how all songs are mixed by default.
# You can override any of these settings per-song by placing a mix.yaml
# file in the song's folder (e.g. songs/My Song/mix.yaml).
#
# All gain values are in dB. Positive numbers are louder; negative quieter.

# Whether to loudness-normalize each stem before mixing.
# false (default) — stems are mixed at their original recorded levels.
#   Use the gain values in track_rules to balance the stems manually.
# true — each stem is normalized to target_lufs before mixing.
#   Useful if your stems have wildly inconsistent recording levels.
#   Note: normalizing many stems to the same LUFS target and then summing
#   them will increase the overall level significantly. Lower target_lufs
#   (e.g. -23) to leave headroom when mixing 10–20 stems simultaneously.
normalize: false

# Number of stems to normalize in parallel (only used when normalize: true).
# 0 means auto — uses the number of CPU cores on the machine, up to 8.
# Reduce to 2 or 4 if you see slowdowns on an older or lower-spec Mac.
normalization_concurrency: 0

# Target loudness per stem when normalize: true.
# -23 LUFS leaves enough headroom for a full 20-stem mix without clipping.
# (-14 LUFS is the streaming standard but clips badly with many stems summed.)
target_lufs: -23

# Format for generated mix files.
# Options: m4a  mp3  wav
output_format: m4a

# Bus groups — logical groupings of stems with a shared master gain fader.
#
# How the two-level gain model works:
#   effective gain = bus gain_db + stem gain_db (from track_rules below)
#
# This is empty by default because each category in track_rules already acts
# as a group for any numbered stems it contains — for example:
#   electric_guitar controls EG 1, EG 2, and EG 3 simultaneously
#   keys            controls Keys 1, Keys 2, Keys 3, Keys 4, and Keys 5
#   piano           controls Piano and Piano 2
#
# To create a cross-category group (e.g. a "Rhythm" fader that controls both
# drums and bass together), add a bus entry here:
#
#   buses:
#     - name: Rhythm
#       gain_db: 0
#       contains: [drums, percussion, bass, synth_bass]
#
# Category names must match the classifier (see track_rules below).
buses: []

# Per-stem gain values. Each value is also the effective gain unless a bus
# is defined above — with a bus, effective gain = bus gain_db + stem gain_db.
# (Stems not listed here get 0 dB.)
track_rules:
  click:
    gain_db: -10      # Click is kept quiet so it doesn't dominate

  guide:
    gain_db: 2        # Guide vocal lifted slightly for rehearsal clarity

  drums:
    gain_db: 0

  percussion:
    gain_db: -2

  bass:
    gain_db: 0

  synth_bass:
    gain_db: -2

  keys:
    gain_db: -3

  piano:
    gain_db: -3

  organ:
    gain_db: -3

  electric_guitar:
    gain_db: -4

  acoustic_guitar:
    gain_db: -4

  bgvs:
    gain_db: -6

  choir:
    gain_db: -6

  lead_vocals:
    gain_db: 0

  fx:
    gain_db: -6

  vox_fx:
    gain_db: -8

  unknown:
    gain_db: 0        # Unrecognized stems pass through at unity gain

# Mix definitions — one output file is generated per entry.
# Each mix can exclude categories, restrict to a category subset (include_only),
# or override gain values for specific categories within that mix.
mixes:
  - name: full
    # All stems included with default gains above

  - name: no-click
    # Same as full but without the click track (good for live run-throughs)
    exclude: [click]

  - name: no-guide
    # Full mix without the guide vocal
    exclude: [guide]

  - name: drummer
    # Click-centric mix for the drummer: rhythm section + quiet guide reference
    include_only: [click, drums, percussion, bass, synth_bass, guide]
    overrides:
      guide:
        gain_db: -3

  - name: vocalist
    # No click, louder guide and backing vocals for singers
    exclude: [click]
    overrides:
      guide:
        gain_db: 4
      bgvs:
        gain_db: 0
      choir:
        gain_db: 0
