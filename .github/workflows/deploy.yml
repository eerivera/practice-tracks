name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '_internal/web/**'
      - '_internal/common/**'
      - 'config/default_mix.yaml'
      - 'package*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint, and test
        run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build browser bundle
        run: npm run web:build:static
        env:
          VITE_BASE: /practice-tracks/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _internal/web/dist/

      - uses: actions/deploy-pages@v5
        id: deploy
